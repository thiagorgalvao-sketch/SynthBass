<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AURA Bass">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b0a09">
<title>AURA Synth Bass</title>
<style>
  :root{
    --ink:#15171a; --ink2:#454a52; --amber:#ffab2e; --led:#ff5a36; --ok:#3ddc84; --oled:#7fe9ff;
    --k:clamp(54px,6vw,80px); --cheek:clamp(12px,2.4vw,34px); --pad:clamp(10px,1.6vw,22px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0b0a09;color:var(--ink);overscroll-behavior:none;
    font-family:"Avenir Next","Futura","Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:manipulation}

  /* instrumento ocupa a tela toda */
  .synth{display:flex;min-height:100vh;min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .body{flex:1;min-width:0;display:flex;flex-direction:column;background:#0c0d0e}

  /* madeira: veios gerados por ruído + verniz */
  .cheek{flex:0 0 var(--cheek);position:relative;
    background:
      linear-gradient(90deg,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 22%,rgba(255,225,180,.20) 48%,rgba(0,0,0,0) 72%,rgba(0,0,0,.6) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='900' preserveAspectRatio='none'><filter id='w' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='0.32 0.006' numOctaves='5' seed='11'/><feColorMatrix values='0 0 0 0 0.16  0 0 0 0 0.07  0 0 0 0 0.02  2.6 0 0 0 -0.75'/></filter><filter id='p' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='0.9 0.05' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.10  0 0 0 0 0.04  0 0 0 0 0.01  0.9 0 0 0 -0.38'/></filter><rect width='100%' height='100%' fill='%238b5427'/><rect width='100%' height='100%' filter='url(%23w)'/><rect width='100%' height='100%' filter='url(%23p)'/></svg>") center/100% 100%,
      #6b3f1f;
    box-shadow:inset 0 2px 2px rgba(255,220,170,.35),inset 0 -3px 4px rgba(0,0,0,.6)}
  .cheek::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 18%,rgba(0,0,0,0) 80%,rgba(0,0,0,.35))}

  /* alumínio escovado: ruído esticado na horizontal + reflexos */
  .panel{position:relative;padding:var(--pad) calc(var(--pad) + 14px) calc(var(--pad) + 2px);
    background:
      linear-gradient(100deg,rgba(255,255,255,0) 18%,rgba(255,255,255,.42) 34%,rgba(255,255,255,0) 50%,rgba(0,0,0,.07) 72%,rgba(255,255,255,.22) 92%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='300' preserveAspectRatio='none'><filter id='m' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='0.003 0.95' numOctaves='4' seed='5'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncR type='linear' slope='1.9' intercept='-0.45'/><feFuncG type='linear' slope='1.9' intercept='-0.45'/><feFuncB type='linear' slope='1.9' intercept='-0.45'/><feFuncA type='discrete' tableValues='1'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23m)'/></svg>") center/100% 100%,
      linear-gradient(180deg,#e3e5e8 0,#c9ccd1 45%,#aeb2b8 100%);
    background-blend-mode:normal,overlay,normal;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.85),inset 0 -2px 0 rgba(0,0,0,.35),inset 2px 0 0 rgba(255,255,255,.4),inset -2px 0 0 rgba(0,0,0,.18)}
  .screw{position:absolute;width:13px;height:13px;border-radius:50%;
    background:linear-gradient(45deg,transparent 44%,#2a2c30 44% 56%,transparent 56%),conic-gradient(#f4f5f6,#8d9197,#e9ebed,#7d8187,#f4f5f6);
    box-shadow:0 1px 1px rgba(255,255,255,.8),inset 0 0 0 1px rgba(0,0,0,.35),0 -1px 1px rgba(0,0,0,.35)}
  .screw.tl{top:7px;left:7px} .screw.tr{top:7px;right:7px;transform:rotate(70deg)}
  .screw.bl{bottom:7px;left:7px;transform:rotate(120deg)} .screw.br{bottom:7px;right:7px;transform:rotate(25deg)}

  /* cabeçalho */
  .top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:8px}
  .brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
  .brand b{font-size:clamp(22px,3vw,34px);letter-spacing:.3em;font-weight:800;color:#1b1d20;text-shadow:0 1px 0 rgba(255,255,255,.75)}
  .brand span{font-size:clamp(9px,1.1vw,12px);letter-spacing:.42em;font-weight:700;color:var(--ink2);text-shadow:0 1px 0 rgba(255,255,255,.7)}
  .oled{background:#040506;border-radius:7px;padding:7px 10px;border:1px solid #000;
    box-shadow:0 1px 0 rgba(255,255,255,.8),0 0 0 3px #26282c,inset 0 0 14px #000;display:flex;align-items:center;gap:10px;width:336px;flex:0 0 auto;overflow:hidden}
  .oled canvas{display:block;width:112px;height:44px;flex:0 0 112px}
  .oled .txt{font-family:"SF Mono",Menlo,Consolas,monospace;color:var(--oled);font-size:10px;line-height:1.45;letter-spacing:.5px;text-shadow:0 0 6px rgba(127,233,255,.6);white-space:nowrap;overflow:hidden;flex:1 1 0;min-width:0}
  .oled .txt b,.oled .txt span{display:block;height:15px;overflow:hidden;text-overflow:ellipsis}
  .oled .txt b{font-size:13px;height:18px}
  .tools{display:flex;flex-wrap:wrap;gap:8px}

  .btn{font:inherit;font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#eceef0;
    background:linear-gradient(180deg,#44474e 0,#26282d 48%,#17181b 52%,#202226 100%);border:1px solid #050506;border-radius:7px;padding:0 13px;min-height:44px;
    display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 0 rgba(255,255,255,.65),0 3px 5px rgba(0,0,0,.4)}
  .btn:active{transform:translateY(1px);box-shadow:inset 0 2px 5px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.65)}
  .btn i{width:9px;height:9px;border-radius:50%;background:#3a1a14;box-shadow:inset 0 1px 2px #000,0 1px 0 rgba(255,255,255,.2)}
  .btn.on i{background:radial-gradient(circle at 35% 30%,#ffd0c2,var(--led) 55%);box-shadow:0 0 9px var(--led)}
  .btn.ok i{background:radial-gradient(circle at 35% 30%,#d6ffe6,var(--ok) 55%);box-shadow:0 0 9px var(--ok)}
  .btn.err i{background:#ffd23e;box-shadow:0 0 9px #ffd23e}
  .btn.icon{padding:0 12px;font-size:17px;letter-spacing:0}

  .status{font-size:12px;line-height:16px;height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);margin:0 0 12px;text-shadow:0 1px 0 rgba(255,255,255,.6)}
  body.learn .status{color:#8a2a10;font-weight:700}

  /* seções gravadas no metal */
  .sections{display:flex;flex-wrap:wrap;gap:12px 10px}
  .sec{flex:1 1 auto;border:1.5px solid rgba(20,22,25,.85);border-radius:9px;padding:17px 8px 7px;position:relative;
    box-shadow:0 1px 0 rgba(255,255,255,.75),inset 0 1px 0 rgba(255,255,255,.35);background:rgba(255,255,255,.07)}
  .sec h2{position:absolute;top:-9px;left:12px;margin:0;padding:2px 8px 1px;font-size:9.5px;letter-spacing:3px;font-weight:800;
    background:#17191c;color:#e9eaec;border-radius:3px;box-shadow:0 1px 0 rgba(255,255,255,.7)}
  .ctrls{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:flex-start;justify-content:center}

  /* knob: saia preta serrilhada + tampa de alumínio torneado */
  .kn{width:calc(var(--k) + 8px);text-align:center}
  .dial{width:var(--k);height:var(--k);margin:0 auto;border-radius:50%;position:relative;touch-action:none;cursor:ns-resize;
    background:repeating-conic-gradient(from -135deg,#17191c 0 1.5deg,transparent 1.5deg 27deg)}
  .dial::before{content:"";position:absolute;inset:8%;border-radius:50%;
    background:radial-gradient(circle,#b9bcc1 60%,#9da1a7);box-shadow:inset 0 2px 4px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.7)}
  .cap{position:absolute;inset:13%;border-radius:50%;
    background:repeating-conic-gradient(#0c0d0e 0 5deg,#2b2d31 5deg 10deg);
    box-shadow:0 7px 10px rgba(0,0,0,.55),0 2px 2px rgba(0,0,0,.5)}
  .cap::before{content:"";position:absolute;inset:13%;border-radius:50%;
    background:conic-gradient(from 20deg,#fafbfc,#8e9298 12%,#e6e8ea 25%,#7c8086 38%,#f2f3f4 50%,#8a8e94 63%,#e3e5e7 75%,#787c82 88%,#fafbfc);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.6)}
  .cap::after{content:"";position:absolute;left:50%;top:2%;width:8%;height:42%;margin-left:-4%;border-radius:2px;background:#101113;box-shadow:0 0 0 .5px rgba(255,255,255,.35)}
  .kn.big .dial{width:calc(var(--k)*1.22);height:calc(var(--k)*1.22)} .kn.big{width:calc(var(--k)*1.22 + 8px)}
  .kn.big .cap::after{background:#d8421c}
  .kn label{display:block;white-space:nowrap;overflow:hidden;margin-top:4px;font-size:9.5px;letter-spacing:1.5px;font-weight:800;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .kn output{display:block;height:13px;white-space:nowrap;overflow:hidden;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:10.5px;color:var(--ink2);min-height:13px}
  .kn .cc{display:block;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:9.5px;color:#fff;background:var(--ink);border-radius:4px;padding:0 5px;margin:2px auto 0;width:46px;height:13px;line-height:13px;overflow:hidden;visibility:hidden}
  .kn.mapped .cc{visibility:visible}
  body.learn .kn .dial{box-shadow:0 0 0 3px rgba(255,171,46,.6);cursor:pointer}
  body.learn .kn.target .dial{box-shadow:0 0 0 4px var(--led),0 0 18px var(--led);animation:blink .7s infinite alternate}
  @keyframes blink{to{box-shadow:0 0 0 4px var(--led),0 0 4px var(--led)}}

  /* seletores */
  .sel{text-align:center}
  .sel .cap2{font-size:9.5px;letter-spacing:1.5px;font-weight:800;margin-top:5px;text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .seg{display:inline-flex;border-radius:7px;overflow:hidden;border:1px solid #050506;box-shadow:0 1px 0 rgba(255,255,255,.65),0 3px 5px rgba(0,0,0,.4)}
  .seg button{font:inherit;border:0;background:linear-gradient(180deg,#44474e 0,#26282d 48%,#17181b 52%,#202226 100%);color:#9aa0a9;min-width:46px;min-height:42px;padding:0 7px;
    border-right:1px solid #050506;font-weight:800;font-size:16px}
  .seg button:last-child{border-right:0}
  .seg button.on{color:var(--amber);background:linear-gradient(180deg,#1c1d21,#0c0d0e);text-shadow:0 0 8px rgba(255,171,46,.7);box-shadow:inset 0 2px 5px #000}
  .seg svg{width:28px;height:17px;display:block;margin:0 auto;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
  .octv{font-family:"SF Mono",Menlo,Consolas,monospace;background:#040506;color:var(--oled);min-width:44px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;border-right:1px solid #050506;text-shadow:0 0 6px rgba(127,233,255,.6)}
  .stack{display:flex;flex-direction:column;gap:9px;align-items:center;padding:0 6px}

  .pnav{display:flex;align-items:stretch;gap:6px}
  .pnav .btn{font-size:16px;padding:0 14px;letter-spacing:0}
  .dlg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
  .dlg.open{display:flex}
  .dlg .box{width:min(440px,100%);background:linear-gradient(180deg,#e3e5e8,#b9bcc1);border-radius:12px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.85)}
  .dlg h3{margin:0 0 12px;font-size:13px;letter-spacing:3px}
  .dlg input{width:100%;font:inherit;font-size:17px;padding:12px;border-radius:8px;border:1px solid #050506;background:#040506;color:var(--oled);
    font-family:"SF Mono",Menlo,Consolas,monospace;-webkit-user-select:text;user-select:text;margin-bottom:12px}
  .dlg .btn{width:100%;justify-content:center;margin-top:8px}
  .dlg .btn.danger{background:linear-gradient(180deg,#8a2a1a,#4d140b)}
  .dlg p{font-size:12px;color:var(--ink2);margin:10px 0 0}

  /* teclado ocupa o resto da tela */
  .keysWrap{flex:1 1 auto;min-height:150px;display:flex;flex-direction:column;background:linear-gradient(180deg,#050506,#17191c);padding:0 clamp(6px,1vw,14px) clamp(8px,1.2vw,16px)}
  .felt{height:7px;margin:0 calc(-1*clamp(6px,1vw,14px)) 0;background:linear-gradient(180deg,#5e0f12,#8f1c20 60%,#3c090b);box-shadow:0 2px 4px rgba(0,0,0,.8)}
  #kb{position:relative;flex:1;min-height:130px;touch-action:none}
  .k{position:absolute;top:0}
  .k.w{height:100%;background:linear-gradient(180deg,#d9d6cc 0,#f7f5ef 7%,#fdfcf8 60%,#ece9e0 100%);border:1px solid #77736b;border-top:0;border-radius:0 0 6px 6px;
    box-shadow:inset 0 -10px 10px rgba(0,0,0,.14),inset 2px 0 0 rgba(255,255,255,.9),inset -1px 0 0 rgba(0,0,0,.08)}
  .k.b{height:61%;z-index:2;background:linear-gradient(90deg,#000 0,#2b2d31 12%,#1a1b1e 50%,#2b2d31 88%,#000 100%);border-radius:0 0 5px 5px;
    box-shadow:0 5px 6px rgba(0,0,0,.65),inset 0 -9px 5px rgba(255,255,255,.10),inset 0 -1px 0 rgba(255,255,255,.25)}
  .k.w.d{background:linear-gradient(180deg,#f2b86a,#ffd089 30%,#ffab2e);box-shadow:inset 0 -3px 6px rgba(0,0,0,.2)}
  .k.b.d{background:linear-gradient(180deg,#b06a05,#6a3e00);box-shadow:0 2px 3px rgba(0,0,0,.65)}

  /* modo tocar (expandido): somem os botões de configuração; knobs, visor e teclado ficam */
  body.perf .tools .btn:not(#fsBtn), body.perf .status{display:none}
  body.perf .top{margin-bottom:16px;flex-wrap:nowrap}
  body.perf .tools{width:auto;flex:0 0 auto}
  body.perf .brand{width:auto;min-width:0;overflow:hidden}
  body.perf .pnav{width:auto;flex:0 1 auto;min-width:0}
  @media (max-width:700px){ body.perf .brand span{display:none} body.perf .oled canvas{display:none} }
  /* telas baixas (celular deitado, tablet pequeno) */
  @media (max-height:560px){ :root{--k:clamp(44px,9vh,60px)} .status{display:none} .top{margin-bottom:12px} .btn{min-height:38px} .seg button{min-height:36px} .keysWrap{min-height:120px} #kb{min-height:105px} }
  /* telas estreitas (em pé) */
  @media (max-width:700px){ :root{--k:clamp(54px,17vw,74px)} .oled{flex:1 1 0;width:auto;min-width:0} .pnav{width:100%} .brand{width:100%} .tools .btn{flex:1;justify-content:center} .tools{width:100%} }
</style>
</head>
<body>
<div class="synth">
  <div class="cheek"></div>
  <div class="body">
    <div class="panel">
      <span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span>
      <div class="top">
        <div class="brand"><b>AURA</b><span>SYNTH BASS</span></div>
        <div class="pnav">
        <button id="pPrev" class="btn" aria-label="Preset anterior">◀</button>
        <div class="oled">
          <canvas id="scope" width="224" height="88"></canvas>
          <div class="txt"><b id="oPreset">01 DEEP SUB BASS</b><span id="oMidi">MIDI: —</span><span id="lastMsg">&nbsp;</span></div>
        </div>
        <button id="pNext" class="btn" aria-label="Próximo preset">▶</button>
        </div>
        <div class="tools">
          <button id="start" class="btn"><i></i>Ligar áudio</button>
          <button id="midiBtn" class="btn"><i></i>Conectar MIDI</button>
          <button id="saveBtn" class="btn">Salvar preset</button>
          <button id="learnBtn" class="btn"><i></i>Mapear knobs</button>
          <button id="clearBtn" class="btn" title="Apagar mapeamento">Limpar</button>
          <button id="fsBtn" class="btn icon" title="Modo tocar (tela cheia)" aria-label="Modo tocar">⛶</button>
        </div>
      </div>
      <p class="status" id="midiInfo">Toque em “Ligar áudio” e depois em “Conectar MIDI”. Gire os knobs arrastando para cima e para baixo; toque duplo volta ao valor do preset.</p>

      <div class="sections">
        <div class="sec"><h2>OSCILADOR</h2>
          <div class="ctrls">
            <div class="stack">
              <div class="sel">
                <div class="seg" id="waveSeg">
                  <button data-w="square" title="Quadrada"><svg viewBox="0 0 30 18"><path d="M2 14V4h9v10h9V4h8"/></svg></button>
                  <button data-w="sawtooth" title="Dente de serra"><svg viewBox="0 0 30 18"><path d="M2 14L14 4v10L26 4v10"/></svg></button>
                  <button data-w="triangle" title="Triângulo"><svg viewBox="0 0 30 18"><path d="M2 14l6.5-10 6.5 10 6.5-10L28 14"/></svg></button>
                </div>
                <div class="cap2">ONDA</div>
              </div>
              <div class="sel">
                <div class="seg"><button id="octDn">−</button><span class="octv" id="octV">-1</span><button id="octUp">+</button></div>
                <div class="cap2">OITAVA</div>
              </div>
            </div>
            <div id="sec_osc" class="ctrls"></div>
          </div>
        </div>
        <div class="sec"><h2>FILTRO</h2><div id="sec_flt" class="ctrls"></div></div>
        <div class="sec"><h2>ENVELOPE</h2><div id="sec_env" class="ctrls"></div></div>
        <div class="sec"><h2>SAÍDA</h2><div id="sec_out" class="ctrls"></div></div>
      </div>

    </div>
    <div class="keysWrap"><div class="felt"></div><div id="kb"></div></div>
  </div>
  <div class="cheek"></div>
</div>
<div class="dlg" id="dlg"><div class="box">
  <h3>SALVAR PRESET</h3>
  <input id="pName" type="text" maxlength="18" autocomplete="off" autocapitalize="characters" placeholder="NOME DO PRESET">
  <button id="dNew" class="btn">Salvar como novo</button>
  <button id="dOver" class="btn">Substituir</button>
  <button id="dDel" class="btn danger">Excluir</button>
  <button id="dCancel" class="btn">Cancelar</button>
  <p id="dNote"></p>
</div></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let ctx=null, osc=null, sub=null, oscG=null, subG=null, f1=null, f2=null, amp=null, master=null, comp=null, an=null;
  const PKEYS=['oct','wave','sub','cut','fenv','glide','a','d','s','r','vol'];
  const FACTORY = [
    {name:'DEEP SUB BASS', factory:true, oct:-1, wave:'square',   sub:0.35, cut:0.41, fenv:0.8, glide:0.03,  a:0.008, d:0.295, s:0.59, r:0.19, vol:1.6},
    {name:'REGGAE POP',    factory:true, oct:-1, wave:'triangle', sub:0.45, cut:0.55, fenv:0.6, glide:0.015, a:0.004, d:0.35,  s:0.55, r:0.12, vol:1.8},
    {name:'EQUALIZE',      factory:true, oct:-1, wave:'sawtooth', sub:0.30, cut:0.50, fenv:1.2, glide:0.0,   a:0.003, d:0.22,  s:0.45, r:0.08, vol:1.4}
  ];
  const UKEY='aura_user_presets_v1', LKEY='aura_last_preset_v1';
  let USER=[]; try{ const u=JSON.parse(localStorage.getItem(UKEY)||'[]'); if(Array.isArray(u)) USER=u.filter(p=>p&&typeof p.name==='string'&&PKEYS.every(k=>k in p)); }catch(e){}
  let PRESETS = FACTORY.concat(USER);
  let curPreset = 0, dirty = false;
  try{ const l=parseInt(localStorage.getItem(LKEY)); if(l>=0&&l<PRESETS.length) curPreset=l; }catch(e){}
  const P = {}; PKEYS.forEach(k=>P[k]=PRESETS[curPreset][k]);
  let bend = 0, stack = [], sustainOn = false, held = new Set(), gate = false, learnMode = false;

  const cutHz = v => 30 * Math.pow(18000/30, v);
  const mtof = n => 440 * Math.pow(2, (n-69)/12);
  const ms = v => Math.round(v*1000)+' ms', pc = v => Math.round(v*100)+'%';

  // ---------- Knobs ----------
  const KNOBS = [
    {id:'sub',  sec:'osc', label:'SUB',      min:0,     max:1,   exp:1, fmt:pc},
    {id:'glide',sec:'osc', label:'GLIDE',    min:0,     max:0.4, exp:2, fmt:ms},
    {id:'cut',  sec:'flt', label:'CUTOFF',   min:0,     max:1,   exp:1, fmt:v=>Math.round(cutHz(v))+' Hz', big:true},
    {id:'fenv', sec:'flt', label:'ENV AMT',  min:0,     max:4,   exp:1, fmt:v=>v.toFixed(2)+' oit'},
    {id:'a',    sec:'env', label:'ATTACK',   min:0.002, max:1,   exp:3, fmt:ms},
    {id:'d',    sec:'env', label:'DECAY',    min:0.02,  max:2,   exp:2, fmt:ms},
    {id:'s',    sec:'env', label:'SUSTAIN',  min:0,     max:1,   exp:1, fmt:pc},
    {id:'r',    sec:'env', label:'RELEASE',  min:0.02,  max:2,   exp:2, fmt:ms},
    {id:'vol',  sec:'out', label:'VOLUME',   min:0,     max:3,   exp:1, fmt:v=>v.toFixed(2)+'×', big:true}
  ];
  const KN = {};
  const toPos = (k,v) => Math.pow(Math.min(1,Math.max(0,(v-k.min)/(k.max-k.min))), 1/k.exp);
  const toVal = (k,p) => k.min + (k.max-k.min)*Math.pow(p,k.exp);
  function drawKnob(k){
    const p = toPos(k,P[k.id]);
    k.cap.style.transform = 'rotate('+(-135+p*270)+'deg)';
    k.out.textContent = k.fmt(P[k.id]);
  }
  KNOBS.forEach(k=>{
    const w=document.createElement('div'); w.className='kn'+(k.big?' big':'');
    w.innerHTML='<div class="dial"><div class="cap"></div></div><label>'+k.label+'</label><output></output><span class="cc"></span>';
    $('sec_'+k.sec).appendChild(w);
    k.dial=w.querySelector('.dial'); k.cap=w.querySelector('.cap'); k.out=w.querySelector('output'); k.wrap=w; k.ccEl=w.querySelector('.cc'); KN[k.id]=k;
    let startY=0, startP=0, drag=false, lastTap=0;
    k.dial.addEventListener('pointerdown',e=>{
      if(learnMode){ setTarget(k.id); return; }
      const now=Date.now();
      if(now-lastTap<320){ P[k.id]=PRESETS[curPreset][k.id]; drawKnob(k); applyAll(); lastTap=0; return; }
      lastTap=now; drag=true; startY=e.clientY; startP=toPos(k,P[k.id]); k.dial.setPointerCapture(e.pointerId); e.preventDefault();
    });
    k.dial.addEventListener('pointermove',e=>{
      if(!drag) return;
      const p=Math.min(1,Math.max(0,startP+(startY-e.clientY)/220));
      P[k.id]=toVal(k,p); drawKnob(k); applyAll(); setDirty(true);
    });
    const end=()=>{drag=false;};
    k.dial.addEventListener('pointerup',end); k.dial.addEventListener('pointercancel',end);
    drawKnob(k);
  });

  // ---------- Mapeamento de knobs (MIDI learn) ----------
  const MAPKEY='aura_cc_map_v1', RESERVED=[64,120,123];
  let ccMap={}, learnTarget=null;
  try{ ccMap=JSON.parse(localStorage.getItem(MAPKEY)||'{}')||{}; }catch(e){ ccMap={}; }
  function saveMap(){ try{ localStorage.setItem(MAPKEY,JSON.stringify(ccMap)); }catch(e){} }
  function drawMap(){
    KNOBS.forEach(k=>{ k.wrap.classList.remove('mapped'); });
    Object.keys(ccMap).forEach(cc=>{ const k=KN[ccMap[cc]]; if(k){ k.wrap.classList.add('mapped'); k.ccEl.textContent='CC '+cc; } });
  }
  function setTarget(id){
    learnTarget=id; KNOBS.forEach(k=>k.wrap.classList.toggle('target',k.id===id));
    if(id) $('midiInfo').textContent='Agora gire no SMK-25 o knob que vai controlar '+KN[id].label+'.';
  }
  function setLearn(on){
    learnMode=on; document.body.classList.toggle('learn',on); $('learnBtn').classList.toggle('on',on);
    setTarget(null);
    $('midiInfo').textContent=on?'Modo mapeamento: toque em um knob da tela e depois gire o knob do SMK-25. Para terminar, toque de novo em “Mapear knobs”.'
      :'Mapeamento salvo neste aparelho. '+Object.keys(ccMap).length+' knob(s) mapeado(s).';
  }
  function learnCC(cc){
    if(RESERVED.includes(cc)) return;
    Object.keys(ccMap).forEach(c=>{ if(ccMap[c]===learnTarget) delete ccMap[c]; });
    ccMap[cc]=learnTarget; saveMap(); drawMap();
    $('midiInfo').textContent=KN[learnTarget].label+' ficou no CC '+cc+'. Toque no próximo knob ou em “Mapear knobs” para terminar.';
    learnTarget=null; KNOBS.forEach(k=>k.wrap.classList.remove('target'));
  }
  function applyCC(cc,val){
    const k=KN[ccMap[cc]]; if(!k) return false;
    P[k.id]=toVal(k,val/127); drawKnob(k); applyAll(); setDirty(true); return true;
  }
  $('learnBtn').addEventListener('click',()=>setLearn(!learnMode));
  $('clearBtn').addEventListener('click',()=>{ ccMap={}; saveMap(); drawMap(); $('midiInfo').textContent='Mapeamento apagado.'; });
  drawMap();

  function drawSelectors(){
    document.querySelectorAll('#waveSeg button').forEach(b=>b.classList.toggle('on',b.dataset.w===P.wave));
    $('octV').textContent=(P.oct>0?'+':'')+P.oct;
  }
  document.querySelectorAll('#waveSeg button').forEach(b=>b.addEventListener('click',()=>{P.wave=b.dataset.w; drawSelectors(); applyAll(); setDirty(true);}));
  $('octDn').addEventListener('click',()=>{P.oct=Math.max(-3,P.oct-1); drawSelectors(); retune(); setDirty(true);});
  $('octUp').addEventListener('click',()=>{P.oct=Math.min(1,P.oct+1); drawSelectors(); retune(); setDirty(true);});

  function showName(){
    const n=String(curPreset+1).padStart(2,'0');
    $('oPreset').textContent=n+' '+PRESETS[curPreset].name+(dirty?' *':'');
  }
  function setDirty(v){ if(dirty!==v){ dirty=v; showName(); } }
  function loadPreset(i){
    curPreset=((i%PRESETS.length)+PRESETS.length)%PRESETS.length;
    PKEYS.forEach(k=>P[k]=PRESETS[curPreset][k]);
    KNOBS.forEach(drawKnob); drawSelectors(); applyAll(); retune();
    dirty=false; showName();
    try{ localStorage.setItem(LKEY,String(curPreset)); }catch(e){}
  }
  $('pPrev').addEventListener('click',()=>loadPreset(curPreset-1));
  $('pNext').addEventListener('click',()=>loadPreset(curPreset+1));

  // ---------- Salvar / substituir / excluir preset ----------
  const dlg=$('dlg'), pName=$('pName');
  function persistUser(){
    USER=PRESETS.filter(p=>!p.factory);
    try{ localStorage.setItem(UKEY,JSON.stringify(USER)); return true; }catch(e){ return false; }
  }
  function snapshot(name){ const o={name:name}; PKEYS.forEach(k=>o[k]=P[k]); return o; }
  function cleanName(){ return (pName.value||'').trim().toUpperCase().slice(0,18) || ('MEU PRESET '+(USER.length+1)); }
  function openDlg(){
    const cur=PRESETS[curPreset], isUser=!cur.factory;
    pName.value=isUser?cur.name:'';
    $('dOver').style.display=isUser?'':'none'; $('dDel').style.display=isUser?'':'none';
    if(isUser){ $('dOver').textContent='Substituir “'+cur.name+'”'; $('dDel').textContent='Excluir “'+cur.name+'”'; }
    $('dNote').textContent=isUser?'Os presets ficam salvos neste aparelho.':'Presets de fábrica não são alterados: o seu ajuste é salvo como um preset novo, neste aparelho.';
    dlg.classList.add('open');
  }
  function closeDlg(msg){ dlg.classList.remove('open'); pName.blur(); if(msg) $('midiInfo').textContent=msg; }
  $('saveBtn').addEventListener('click',openDlg);
  $('dCancel').addEventListener('click',()=>closeDlg());
  dlg.addEventListener('click',e=>{ if(e.target===dlg) closeDlg(); });
  $('dNew').addEventListener('click',()=>{
    const p=snapshot(cleanName()); PRESETS.push(p); const ok=persistUser();
    loadPreset(PRESETS.length-1); closeDlg(ok?'Preset “'+p.name+'” salvo.':'Não foi possível gravar neste navegador; o preset vale só até fechar a página.');
  });
  $('dOver').addEventListener('click',()=>{
    if(PRESETS[curPreset].factory) return;
    const p=snapshot(cleanName()); PRESETS[curPreset]=p; const ok=persistUser();
    loadPreset(curPreset); closeDlg(ok?'Preset “'+p.name+'” atualizado.':'Não foi possível gravar neste navegador.');
  });
  $('dDel').addEventListener('click',()=>{
    if(PRESETS[curPreset].factory) return;
    const n=PRESETS[curPreset].name; PRESETS.splice(curPreset,1); persistUser();
    loadPreset(Math.min(curPreset,PRESETS.length-1)); closeDlg('Preset “'+n+'” excluído.');
  });
  showName();
  drawSelectors();

  // ---------- Áudio ----------
  function initAudio(){
    if(ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC({latencyHint:'interactive'});
    osc = ctx.createOscillator(); sub = ctx.createOscillator(); sub.type='sine';
    oscG = ctx.createGain(); subG = ctx.createGain();
    f1 = ctx.createBiquadFilter(); f2 = ctx.createBiquadFilter();
    f1.type = f2.type = 'lowpass'; f1.Q.value = 0.707; f2.Q.value = 0.707; // 2 × 12 dB = 24 dB/oit
    amp = ctx.createGain(); amp.gain.value = 0;
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value=-14; comp.knee.value=10; comp.ratio.value=5; comp.attack.value=0.004; comp.release.value=0.15;
    master = ctx.createGain(); an = ctx.createAnalyser(); an.fftSize = 1024;
    osc.connect(oscG); sub.connect(subG); oscG.connect(f1); subG.connect(f1);
    f1.connect(f2); f2.connect(amp); amp.connect(comp); comp.connect(master); master.connect(an); an.connect(ctx.destination);
    osc.frequency.value = sub.frequency.value = 55;
    f1.frequency.value = f2.frequency.value = cutHz(P.cut);
    osc.start(); sub.start();
    applyAll();
    $('start').classList.add('on');
  }
  function applyAll(){
    if(!ctx) return;
    osc.type = P.wave; oscG.gain.value = 0.45; subG.gain.value = P.sub * 0.6; master.gain.value = P.vol;
    if(!gate){ f1.frequency.value = f2.frequency.value = cutHz(P.cut); }
    updateDetune();
  }
  function updateDetune(){ if(!ctx) return; const c = bend>=0 ? bend*200 : bend*1200; osc.detune.value=c; sub.detune.value=c; }
  const noteFreq = n => mtof(n + P.oct*12);
  function holdParam(p,t){ if(p.cancelAndHoldAtTime){ p.cancelAndHoldAtTime(t); } else { const v=p.value; p.cancelScheduledValues(t); p.setValueAtTime(v,t); } }
  function triggerEnv(vel){
    const t = ctx.currentTime, peak = 0.45 + 0.55*(vel/127), att=Math.max(P.a,0.002);
    holdParam(amp.gain,t); amp.gain.linearRampToValueAtTime(peak, t+att); amp.gain.setTargetAtTime(peak*P.s, t+att, P.d/3);
    const base = cutHz(P.cut), top = Math.min(base*Math.pow(2,P.fenv),20000), susF = Math.min(base*Math.pow(2,P.fenv*P.s),20000);
    [f1,f2].forEach(f=>{ holdParam(f.frequency,t); f.frequency.setValueAtTime(base,t); f.frequency.linearRampToValueAtTime(top,t+att); f.frequency.setTargetAtTime(susF,t+att,P.d/3); });
    gate = true;
  }
  function releaseEnv(){
    const t = ctx.currentTime, base = cutHz(P.cut);
    holdParam(amp.gain,t); amp.gain.setTargetAtTime(0,t,P.r/3);
    [f1,f2].forEach(f=>{ holdParam(f.frequency,t); f.frequency.setTargetAtTime(base,t,P.r/3); });
    gate = false;
  }
  function setPitch(n, immediate){
    const t = ctx.currentTime, fr = noteFreq(n);
    [osc,sub].forEach(o=>{ o.frequency.cancelScheduledValues(t);
      if(immediate || P.glide<0.002) o.frequency.setValueAtTime(fr,t); else o.frequency.setTargetAtTime(fr,t,P.glide/3); });
  }
  function retune(){ if(ctx && stack.length) setPitch(stack[stack.length-1], true); }
  function noteOn(n, vel){
    if(!ctx) return; if(ctx.state!=='running') ctx.resume();
    held.delete(n); stack = stack.filter(x=>x!==n); stack.push(n);
    if(!gate){ setPitch(n,true); triggerEnv(vel||100); } else { setPitch(n,false); }
    markKey(n,true);
  }
  function noteOff(n){ if(!ctx) return; if(sustainOn){ held.add(n); markKey(n,false); return; } realOff(n); }
  function realOff(n){ stack = stack.filter(x=>x!==n); markKey(n,false); if(stack.length===0) releaseEnv(); else setPitch(stack[stack.length-1],false); }
  function setSustain(on){ sustainOn=on; if(!on){ const hs=[...held]; held.clear(); hs.forEach(realOff); } }
  function allOff(){ stack=[]; held.clear(); if(ctx&&gate) releaseEnv(); document.querySelectorAll('.k.d').forEach(k=>k.classList.remove('d')); }

  $('start').addEventListener('click',()=>{ initAudio(); if(ctx.state!=='running') ctx.resume(); keepAwake(); });

  // ---------- Tela cheia e tela sempre ligada ----------
  const root=document.documentElement, fsBtn=$('fsBtn');
  const fsOn=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const canFs=!!(root.requestFullscreen||root.webkitRequestFullscreen);
  let wasFs=false;
  function setPerf(on){
    if(on && learnMode) setLearn(false);
    document.body.classList.toggle('perf',on); fsBtn.classList.toggle('on',on);
    fsBtn.title=on?'Voltar aos controles':'Modo tocar (tela cheia)';
  }
  fsBtn.addEventListener('click',()=>{
    const on=!document.body.classList.contains('perf'); setPerf(on);
    try{
      if(on){
        initAudio(); if(ctx.state!=='running') ctx.resume(); keepAwake(); if(!midi) connectMidi();
        if(canFs && !fsOn()){ const r=(root.requestFullscreen||root.webkitRequestFullscreen).call(root); if(r&&r.catch) r.catch(()=>{}); }
      } else if(fsOn()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    }catch(e){}
  });
  const fsChange=()=>{ if(fsOn()) wasFs=true; else if(wasFs){ wasFs=false; setPerf(false); } };
  document.addEventListener('fullscreenchange',fsChange); document.addEventListener('webkitfullscreenchange',fsChange);
  let wake=null;
  async function keepAwake(){ try{ if('wakeLock' in navigator && !wake){ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{wake=null;}); } }catch(e){} }
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && ctx) keepAwake(); });

  // ---------- Osciloscópio ----------
  const cv=$('scope'), g=cv.getContext('2d'); let buf=null;
  function draw(){
    requestAnimationFrame(draw);
    const W=cv.width,H=cv.height; g.clearRect(0,0,W,H);
    g.strokeStyle='rgba(127,233,255,.18)'; g.lineWidth=1; g.beginPath(); g.moveTo(0,H/2); g.lineTo(W,H/2); g.stroke();
    g.strokeStyle='#7fe9ff'; g.lineWidth=2.5; g.shadowColor='#7fe9ff'; g.shadowBlur=6; g.beginPath();
    if(an){
      if(!buf) buf=new Uint8Array(an.fftSize); an.getByteTimeDomainData(buf);
      let s=0; for(let i=1;i<buf.length/2;i++){ if(buf[i-1]<128&&buf[i]>=128){ s=i; break; } }
      const n=buf.length/2;
      for(let i=0;i<n;i++){ const x=i/(n-1)*W, y=H/2-((buf[s+i]-128)/128)*(H/2-4); i?g.lineTo(x,y):g.moveTo(x,y); }
    } else { g.moveTo(0,H/2); g.lineTo(W,H/2); }
    g.stroke(); g.shadowBlur=0;
  }
  draw();

  // ---------- Teclado de tela (25 teclas) ----------
  const kb=$('kb'), KEYS=[]; const FIRST=36, LAST=60;
  const isBlack=n=>[1,3,6,8,10].includes(n%12);
  (function build(){
    let whites=0; for(let n=FIRST;n<=LAST;n++) if(!isBlack(n)) whites++;
    const w=100/whites; let wi=0;
    for(let n=FIRST;n<=LAST;n++){
      const d=document.createElement('div'); d.dataset.n=n;
      if(!isBlack(n)){ d.className='k w'; d.style.left=(wi*w)+'%'; d.style.width=w+'%'; wi++; }
      else { d.className='k b'; d.style.left=(wi*w - w*0.3)+'%'; d.style.width=(w*0.6)+'%'; }
      kb.appendChild(d); KEYS[n]=d;
    }
  })();
  function markKey(n,on){ if(KEYS[n]) KEYS[n].classList.toggle('d',on); }
  const active=new Map();
  function keyAt(x,y){ const el=document.elementFromPoint(x,y); return el&&el.dataset&&el.dataset.n?parseInt(el.dataset.n):null; }
  kb.addEventListener('pointerdown',e=>{ if(!ctx) initAudio(); const n=keyAt(e.clientX,e.clientY); if(n==null)return; kb.setPointerCapture(e.pointerId); active.set(e.pointerId,n); noteOn(n,100); });
  kb.addEventListener('pointermove',e=>{ if(!active.has(e.pointerId))return; const n=keyAt(e.clientX,e.clientY); const cur=active.get(e.pointerId); if(n!=null&&n!==cur){ noteOn(n,100); noteOff(cur); active.set(e.pointerId,n);} });
  const up=e=>{ if(!active.has(e.pointerId))return; noteOff(active.get(e.pointerId)); active.delete(e.pointerId); };
  kb.addEventListener('pointerup',up); kb.addEventListener('pointercancel',up);

  // ---------- MIDI ----------
  let midi=null, count=0;
  const mBtn=$('midiBtn');
  function setMidi(cls,short,long){ mBtn.classList.remove('ok','err'); if(cls) mBtn.classList.add(cls); $('oMidi').textContent='MIDI: '+short; $('midiInfo').textContent=long; }
  function onMsg(ev){
    const d=ev.data, cmd=d[0]&0xF0, d1=d[1], d2=d[2]; count++;
    $('lastMsg').textContent='IN '+Array.from(d).join(' ');
    if(cmd===0x90 && d2>0) noteOn(d1,d2);
    else if(cmd===0x80 || (cmd===0x90&&d2===0)) noteOff(d1);
    else if(cmd===0xC0){ if(d1<PRESETS.length) loadPreset(d1); }
    else if(cmd===0xE0){ bend=(((d2<<7)|d1)-8192)/8192; updateDetune(); }
    else if(cmd===0xB0){
      if(learnMode && learnTarget){ learnCC(d1); return; }
      if(d1===64) setSustain(d2>=64); else if(d1===123||d1===120) allOff(); else applyCC(d1,d2);
    }
  }
  function refreshInputs(){
    if(!midi) return;
    const names=[]; midi.inputs.forEach(inp=>{ inp.onmidimessage=onMsg; names.push(inp.name||'entrada MIDI'); });
    if(names.length) setMidi('ok', names[0].slice(0,14).toUpperCase(), 'Conectado: '+names.join(' · '));
    else setMidi('err','SEM DISPOSITIVO','MIDI ativo, mas nenhum dispositivo encontrado. Ligue o SMK-25 e pareie o Bluetooth com o tablet.');
  }
  async function connectMidi(){
    if(!ctx) initAudio();
    if(!navigator.requestMIDIAccess){
      setMidi('err','SEM SUPORTE','Este navegador não suporta Web MIDI. No Samsung use Chrome ou Samsung Internet. No iPad o Safari e o Chrome não suportam; use o teclado de tela.');
      return;
    }
    try{ midi=await navigator.requestMIDIAccess({sysex:false}); midi.onstatechange=refreshInputs; refreshInputs(); }
    catch(err){ setMidi('err','BLOQUEADO','Permissão de MIDI negada: '+(err&&err.message?err.message:err)); }
  }
  mBtn.addEventListener('click',connectMidi);

  document.addEventListener('visibilitychange',()=>{ if(document.hidden) allOff(); });
})();
</script>
</body>
</html>
