name: Build VST3/AU
on:
  push:
    paths: ['vst/**', '.github/workflows/vst.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          set -o pipefail
          cmake -S vst -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee ../build-mac.log
          cmake --build build --config Release -j 4 2>&1 | tee -a ../build-mac.log
      - name: Package
        run: |
          mkdir -p out
          cp -R build/AuraSynthBass_artefacts/Release/VST3/*.vst3 out/ || true
          cp -R build/AuraSynthBass_artefacts/Release/AU/*.component out/ || true
          codesign --force --deep -s - out/*.vst3 || true
          codesign --force --deep -s - out/*.component || true
          lipo -archs "out/AURA Synth Bass.vst3/Contents/MacOS/AURA Synth Bass" || true
          cd out && zip -r -y ../AURA-Synth-Bass-macOS.zip . && cd ..
      - uses: actions/upload-artifact@v4
        with: { name: AURA-Synth-Bass-macOS, path: AURA-Synth-Bass-macOS.zip }
      - name: Push log
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          cp ../build-mac.log . 2>/dev/null || true
          git checkout --orphan buildlog && git rm -rf . -q || true
          cp ../build-mac.log build-mac.log 2>/dev/null || echo "sem log" > build-mac.log
          git add build-mac.log && git commit -m "log mac" -q && git push -f origin buildlog
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        shell: bash
        run: |
          set -o pipefail
          cmake -S vst -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee ../build-win.log
          cmake --build build --config Release -j 4 2>&1 | tee -a ../build-win.log
      - name: Package
        shell: bash
        run: |
          mkdir out && cp -R build/AuraSynthBass_artefacts/Release/VST3/*.vst3 out/
          cd out && 7z a ../AURA-Synth-Bass-Windows.zip . && cd ..
      - uses: actions/upload-artifact@v4
        with: { name: AURA-Synth-Bass-Windows, path: AURA-Synth-Bass-Windows.zip }
